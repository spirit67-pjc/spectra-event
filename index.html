<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPECTRA – Visual Kei Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&display=swap">
<style>:root{color-scheme:dark;--bg:#06030d;--card:#0e0820;--line:#2d1f55;--fg:#f5f1ff;--mut:#a095c4;--a:#8b3dff;--a2:#5b21b6;--b:#c4b5fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 88% -8%,#4c1d9566,transparent 70%),radial-gradient(700px 500px at -10% 105%,#5b21b633,transparent 70%),var(--bg);color:var(--fg);font:15px/1.6 "Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.85;background:linear-gradient(112deg,transparent 58%,#8b3dff14 58.2%,#8b3dff14 59.4%,transparent 59.6%),linear-gradient(112deg,transparent 66%,#c4b5fd0f 66.2%,#c4b5fd0f 66.8%,transparent 67%),radial-gradient(#c4b5fd22 1px,transparent 1.5px) 0 0/46px 46px}
h1,h2,h3{font-family:"Exo 2","Arial Black",Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px}
h1{font-size:clamp(34px,8.5vw,68px);line-height:1.05}h2{font-size:26px}h3{font-size:18px}
h2::before{content:"";display:inline-block;width:7px;height:.85em;margin-right:10px;background:linear-gradient(var(--b),var(--a));transform:skewX(-18deg);box-shadow:0 0 10px #8b3dff88}
.g{background:linear-gradient(92deg,#fff,var(--b) 45%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut)}.sm{font-size:12px}a{color:var(--b);cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:8px 16px;background:#06030de6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 #8b3dff33,0 10px 30px #0008}
.logo{height:44px;width:auto;cursor:pointer;margin:0;flex:none;border-radius:6px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{position:relative;background:none;border:0;color:var(--mut);font:italic 700 13px "Exo 2",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:9px 11px;cursor:pointer;white-space:nowrap;transition:.2s}
nav button:hover{color:#fff;background:#8b3dff1f}nav button.on{color:#fff}
nav button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 10px var(--a)}
#bell{font-size:13px;white-space:nowrap}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:26px 18px 70px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{position:relative;background:linear-gradient(160deg,#160d30,#0b0617 70%);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;transition:.25s}
.card::before{content:"";position:absolute;top:-1px;left:-1px;width:34px;height:3px;background:linear-gradient(90deg,var(--b),var(--a));box-shadow:0 0 10px var(--a)}
.card:hover{border-color:#8b3dff99;box-shadow:0 0 28px #8b3dff22,0 10px 30px #0006}
.comp{border-left:3px solid var(--a);background:linear-gradient(135deg,#1d1040,#0b0617 65%);overflow:hidden}
.comp::after{content:"";position:absolute;right:0;top:0;width:110px;height:100%;background:linear-gradient(115deg,transparent 40%,#8b3dff22 41%,#8b3dff22 55%,transparent 56%);pointer-events:none}
.comp h3{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.grid .card{margin:0}
.btn{font:italic 700 14px "Exo 2",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:0;padding:10px 22px;color:#fff;background:linear-gradient(100deg,var(--a2),var(--a) 60%,#a66bff);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:.2s}
.btn:hover{filter:brightness(1.25)}.btn.o{background:linear-gradient(100deg,#1d1244,#2a1a5c);color:var(--fg)}.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:#080413;border:1px solid var(--line);border-radius:4px;padding:10px;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px #8b3dff33}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:inline-flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none;box-shadow:0 0 0 2px #8b3dff55}
.av img,.ban img{width:100%;height:100%;object-fit:cover}.av.l{width:96px;height:96px;font-size:34px;border:3px solid var(--bg)}
.ban{aspect-ratio:3/1;border-radius:6px;background:linear-gradient(120deg,#2a1260,#0b0617 70%);overflow:hidden;border:1px solid var(--line)}
.chip{display:inline-flex;gap:6px;align-items:center;background:#080413;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 4px;margin:3px;cursor:pointer;font-size:13px;transition:.2s}.chip:hover{border-color:var(--a)}.chip .av{width:22px;height:22px;font-size:11px;box-shadow:none}
.bar{height:6px;background:#080413;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a),var(--b));box-shadow:0 0 10px var(--a)}
.tag{font-size:12px;letter-spacing:.12em;color:var(--b);font-weight:700}.st{display:inline-block;border:1px solid var(--a);color:#fff;background:#8b3dff33;padding:0 12px;font-size:12px;letter-spacing:.1em;font-weight:700;transform:skewX(-12deg)}.st.x{border-color:var(--mut);color:var(--mut);background:none}
.img{height:110px;border-radius:4px;margin-bottom:10px;background:linear-gradient(115deg,transparent 45%,#c4b5fd22 46%,#c4b5fd22 52%,transparent 53%),linear-gradient(135deg,#3b1a85,#0b0617)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.cols{grid-template-columns:1fr}}
#auth,#intro{position:fixed;inset:0;z-index:20;background:radial-gradient(700px 420px at 70% 0,#4c1d9577,transparent),radial-gradient(500px 400px at 0 100%,#5b21b644,transparent),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.box{width:100%;max-width:400px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs .btn{flex:1}
.alogo{display:block;width:min(420px,100%);height:auto;margin:0 auto 10px;border-radius:10px}.lp{flex:none;border-radius:10px;overflow:hidden;box-shadow:0 0 40px #8b3dff44}.lp img{display:block;width:min(440px,88vw);height:auto}.herow{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.hero{display:block;width:100%;max-width:720px;margin:0 0 20px;border-radius:6px;border:1px solid var(--line);box-shadow:0 0 40px #8b3dff33}
#intro{z-index:30;flex-direction:column;text-align:center}
#intro .t{width:min(760px,94vw);height:auto;border-radius:10px;animation:sp 3.6s ease forwards}
#intro .s{color:var(--b);letter-spacing:.35em;text-transform:uppercase;font-size:13px;margin-top:14px;opacity:0;animation:fd 1.2s 1.6s forwards}
@keyframes sp{0%{opacity:0;transform:scale(1.25) skewX(-6deg);filter:blur(16px) brightness(2)}50%{opacity:1;transform:none;filter:none}100%{opacity:1;transform:scale(1.03)}}
@keyframes fd{to{opacity:1}}
.msgs{height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:#080413}.msg{padding:6px 0;border-bottom:1px solid #1b1238}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1a0f3a;border:1px solid var(--a);box-shadow:0 0 20px #8b3dff44;padding:9px 16px;border-radius:6px;z-index:40;display:none}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer}
.hidden{display:none!important}
.authcard{background:linear-gradient(160deg,#160d30ee,#0b0617ee);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 0 60px #8b3dff33;animation:in .5s ease}
.authcard input{padding:13px;font-size:16px}.authcard h3{text-align:center;font-size:22px}.authcard .row{display:block}.authcard .btn{width:100%;padding:13px;margin-top:6px}.authcard .alogo{margin-bottom:14px}
.tabs{background:#080413;border:1px solid var(--line);padding:4px;border-radius:10px}.tabs .btn{clip-path:none;border-radius:7px;margin:0!important;width:auto!important}
.otp{letter-spacing:.5em;text-align:center;font-size:26px!important;font-weight:700}.btn.load{opacity:.55;pointer-events:none}
#crop{position:fixed;inset:0;z-index:60;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.cbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:100%;text-align:center}
.av img{image-rendering:auto}
.navw{position:relative;flex:1;min-width:0}.navw nav{width:100%}
.na{position:absolute;top:0;bottom:0;width:36px;display:flex;align-items:center;pointer-events:none;opacity:0;transition:opacity .25s}.na.show{opacity:1}
.na.l{left:0;justify-content:flex-start;background:linear-gradient(90deg,#06030d 25%,transparent)}.na.r{right:0;justify-content:flex-end;background:linear-gradient(270deg,#06030d 25%,transparent)}
.na::before{content:"";width:8px;height:8px;border:solid var(--b);border-width:0 2px 2px 0;filter:drop-shadow(0 0 4px var(--a));animation:nl 1.8s ease-in-out infinite}
.na.l::before{transform:rotate(135deg);margin-left:8px;--d:-3px}.na.r::before{transform:rotate(-45deg);margin-right:8px;--d:3px}
@keyframes nl{0%,100%{translate:0}50%{translate:var(--d) 0}}
@media (prefers-reduced-motion:reduce){.na::before{animation:none}.na{transition:none}}
.cmsgs{height:min(58vh,520px);overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:#080413;padding:4px 10px;-webkit-overflow-scrolling:touch}
.cmsg{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #1b1238}.cmsg:last-child{border-bottom:0}.cmsg .av{width:34px;height:34px;font-size:13px;box-shadow:none}
.cmeta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.cbody{word-break:break-word;white-space:pre-wrap}.cact{margin-top:2px}.cact a{margin-right:2px}
.cmsg.hid{opacity:.55;border-left:3px solid var(--a);padding-left:8px}
</style>
</head><body>

 return `<h2>News</h2>${ADM?`<div class="card"><h3>Admin: ${e?'edit':'new'} post</h3><label>Title</label><input id="nt" value="${esc(e&&e.title)}"><label>Description</label><textarea id="nb" rows="3">${esc(e&&e.body)}</textarea><label>Image</label><input type="file" accept="image/*" data-a="nimg"><label>Publish date and time (schedule)</label><input id="nd" type="datetime-local" value="${e?new Date(new Date(e.publish_at)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):''}"><label>Status</label><select id="ns"><option value="published">Published</option><option value="draft" ${e&&e.status==='draft'?'selected':''}>Draft</option></select><div class="row"><button class="btn" data-a="savenews">Save</button>${e?'<button class="btn o" data-a="newnews">Cancel</button>':''}</div></div>`:''}<div class="grid">${list.map(n=>`<div class="card">${n.image_url?`<img alt="" src="${esc(n.image_url)}" style="width:100%;border-radius:4px;margin-bottom:10px">`:'<div class="img"></div>'}<div class="tag">${fmt(n.publish_at)}${n.status==='draft'?' · DRAFT':new Date(n.publish_at)>now?' · SCHEDULED':''}</div><h3>${esc(n.title)}</h3><p class="mut" style="margin:0">${esc(n.body)}</p>${ADM?`<div class="row"><button class="btn o" data-a="editnews" data-x="${n.id}">Edit</button><button class="btn o" data-a="delnews" data-x="${n.id}">Delete</button></div>`:''}</div>`).join('')||'<div class="card mut">No news yet.</div>'}</div>`},
async trophies(){const r=await sb.from('trophies').select('*'),w={};(r.data||[]).forEach(t=>w[t.competition_id]=t);
 return `<h2>Trophies</h2><p class="mut">Three official trophies, one per competition. Digital only. Winners appear here once results are available.</p><div class="grid">${KEYS.map(k=>`<div class="card" style="text-align:center">${medal(k)}<h3>${INFO[k].t} Trophy</h3><div class="tag">${INFO[k].t}</div><div class="mut sm" style="margin-top:6px">${w[k]&&(w[k].winner_user||w[k].winner_team)?'Winner announced':'Winner: not available yet'}</div></div>`).join('')}</div>`},
async help(){const q=[['Creating an account','Sign up with your email and a password, then enter the 6-digit code we email you. Phone sign-up is not available yet.'],['Customizing a profile','Open your avatar (top right) and press Edit profile.'],['Solo Showdown','Opens Feb 6, 2027. Max 30 participants. Deadline Feb 21.'],['Anime Selection','Opens Feb 25, 2027. Pick one of 4 anime (5 places each, 20 total). Deadline Mar 12.'],['Teams and chat','Team Battles registration opens December 15, 2026 (4 teams, 5 members each, one song per team). The Community Chat is open to all registered members: use Report on any message, and moderators review reports.'],['AI rule','AI-generated content is strictly prohibited in official entries. Report suspected violations on a competition page; administrators review them.'],['Earning trophies','One trophy per competition, awarded by the organizers.']];
 return `<h2>Help</h2><div class="card">${q.map(x=>`<details><summary>${x[0]}</summary><p class="mut">${x[1]}</p></details>`).join('')}</div><div class="card"><h3>Support</h3><p class="mut">Official support: <a href="mailto:support@spectra-event.org">support@spectra-event.org</a></p></div>`},
async user(id){const r=await sb.from('profiles').select('*').eq('id',id).maybeSingle(),p=r.data;if(!p)return '<p class="mut">Profile not found.</p>';const tmr=await sb.from('team_members').select('team_id,role,teams(name,logo_url)').eq('user_id',id).maybeSingle(),tmh=tmr.data&&tmr.data.teams?`<div class="chip" data-a="team" data-x="${esc(tmr.data.team_id)}">${esc(tmr.data.teams.name)} · ${tmr.data.role==='captain'?'Captain':'Member'}</div>`:'<p class="mut">No team yet.</p>';
 return `<div class="ban">${p.banner_url?`<img alt="" src="${esc(p.banner_url)}">`:''}</div><div class="row" style="margin:-48px 0 10px 14px;align-items:flex-end">${av(p,'l')}</div><h2 style="margin:0">${esc(p.display_name||p.username)}</h2><div class="mut">@${esc(p.username)}${p.country?' · '+esc(p.country):''}</div><p>${esc(p.bio)}</p>${tkHtml(p.links)}${id===U.id?'<div class="row"><button class="btn" data-a="edit">Edit profile</button><button class="btn o" data-a="logout">Log out</button></div>':''}
 <h3 style="margin-top:22px">Team</h3>${tmh}<h3>Trophies</h3><p class="mut">No trophies yet.</p>`},
async edit(){const p=Object.assign({},ME||{}),a0=tmp.av?tmp.av.url:p.avatar_url,b0=tmp.bn?tmp.bn.url:p.banner_url;return `<h2>${tmp.first?'Create your profile':'Edit profile'}</h2><div class="card" style="max-width:560px"><label>Banner (you can crop, zoom and reposition)</label><div class="ban" id="pb">${b0?`<img alt="" src="${esc(b0)}">`:''}</div><input type="file" accept="image/png,image/jpeg,image/webp" data-a="banner">
 <label>Profile picture (PNG supported)</label><div class="row" style="margin:0"><span id="pa">${av({avatar_url:a0,display_name:p.display_name||p.username},'l')}</span><input type="file" accept="image/png,image/jpeg,image/webp" data-a="avatar" style="flex:1"></div>
 <label>Username (letters, numbers, _; 3-20)</label><input id="pu" maxlength="20" value="${esc(p.username)}" ${ME?'disabled':''}><label>Display name / nickname</label><input id="pn" maxlength="30" value="${esc(p.display_name)}"><label>Country</label><input id="pc" maxlength="40" value="${esc(p.country)}">
 <label>Biography</label><textarea id="pbio" rows="3" maxlength="240">${esc(p.bio)}</textarea><label>TikTok (username or link)</label><input id="pt" placeholder="@username or https://www.tiktok.com/@username" value="${esc((p.links||'').split('\n')[0])}"><p class="mut sm">Shown on your public profile with your biography.</p><div class="row"><button class="btn" data-a="saveprof">Save profile</button></div></div>`}};

/* ---------- actions ---------- */
async function act(a,x){try{switch(a){
case'go':go(x);break;case'tab':authUI(x);break;case'user':go('user',x);break;case'comp':go('comp',x);break;case'edit':tmp={};go('edit');break;
case'login':{const e=$('#em').value.trim(),r=await sb.auth.signInWithPassword({email:e,password:$('#pw').value});if(r.error){if(/not confirmed/i.test(r.error.message)){tmp.em=e;await sb.auth.resend({type:'signup',email:e});toast('Verify your email: a new code was sent.');return authUI('code')}return toast(r.error.message)}boot();break}
case'signup':{const e=$('#em').value.trim(),p=$('#pw').value;if(p.length<8)return toast('Password: at least 8 characters');if(p!==$('#pw2').value)return toast('Passwords do not match');
 const r=await sb.auth.signUp({email:e,password:p});if(r.error)return toast(r.error.message);if(r.data.session)boot();else{tmp.em=e;toast('Code sent. Check your email.');authUI('code')}break}
case'forgot':{const e=$('#em').value.trim();if(!e)return toast('Enter your email');const r=await sb.auth.resetPasswordForEmail(e);if(r.error)return toast(r.error.message);tmp.em=e;toast('If the email exists, a code was sent.');authUI('rcode');break}
case'verify':{const r=await sb.auth.verifyOtp({email:tmp.em,token:$('#cd').value.trim(),type:'signup'});if(r.error)return toast('Incorrect or expired code. Check the digits or send a new code.');toast('Email verified!');boot();break}
case'rverify':{const p=$('#pw').value;if(p.length<8)return toast('Password: at least 8 characters');const r=await sb.auth.verifyOtp({email:tmp.em,token:$('#cd').value.trim(),type:'recovery'});if(r.error)return toast('Incorrect or expired code. Check the digits or send a new code.');const u=await sb.auth.updateUser({password:p});if(u.error)return toast(u.error.message);toast('Password updated');boot();break}
case'resend':{if(Date.now()-(tmp.rs||0)<60000)return toast('Please wait a minute before requesting another code.');tmp.rs=Date.now();const r=x==='code'?await sb.auth.resend({type:'signup',email:tmp.em}):await sb.auth.resetPasswordForEmail(tmp.em);toast(r.error?r.error.message:'Code sent again');break}
case'setpw':{const p=$('#pw').value;if(p.length<8)return toast('Password: at least 8 characters');const r=await sb.auth.updateUser({password:p});if(r.error)return toast(r.error.message);toast('Password updated');boot();break}
case'logout':await sb.auth.signOut();location.hash='';location.reload();break;
case'saveprof':{const row={display_name:$('#pn').value.trim(),country:$('#pc').value.trim(),bio:$('#pbio').value.trim(),links:$('#pt').value.trim()};
 if(tmp.av)row.avatar_url=await up('avatars',tmp.av.blob,'avatar');if(tmp.bn)row.banner_url=await up('banners',tmp.bn.blob,'banner');let r;
 if(ME)r=await sb.from('profiles').update(row).eq('id',U.id);else{const u=$('#pu').value.trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(u))return toast('Username: 3-20 letters, numbers or _');row.username=u;row.id=U.id;row.display_name=row.display_name||u;r=await sb.from('profiles').insert(row)}
 if(r.error)return toast(r.error.code==='23505'?'Username already taken':'Error: '+r.error.message);
 const first=!ME,p=await sb.from('profiles').select('*').eq('id',U.id).maybeSingle();ME=p.data;meBtn();toast('Profile saved');tmp={};if(first&&!localStorage.getItem('spectra-intro'))intro();else go('user',U.id);break}
case'pick':tmp.song=x;go('newteam');break;
case'mkteam':{const n=$('#tn').value.trim();if(!n||!tmp.song)return toast('Choose a song and enter a team name');const r=await sb.rpc('create_team',{p_song:tmp.song,p_name:n,p_desc:$('#td').value.trim(),p_logo:null,p_banner:null});if(r.error)return toast(em(r.error));const id=r.data;
 if(tmp.tl){const path=id+'/logo-'+Date.now()+'.png',u=await sb.storage.from('teams').upload(path,tmp.tl.blob,{contentType:'image/png',cacheControl:'31536000'});if(u.error)toast('Team created, but the logo upload failed: '+u.error.message);else await sb.from('teams').update({logo_url:sb.storage.from('teams').getPublicUrl(path).data.publicUrl}).eq('id',id)}
 tmp={};toast('Team registered!');go('team',id);break}
case'team':go('team',x);break;case'newteam':tmp={};go('newteam');break;
case'jointeam':{const r=await sb.rpc('request_join',{p_team:x});toast(r.error?em(r.error):'Request sent to the captain');go('team',x);break}
case'approve':{const[t,u]=x.split('|'),r=await sb.rpc('approve_join',{p_team:t,p_user:u});if(r.error)toast(em(r.error));go('team',t);break}
case'leaveteam':{const r=await sb.rpc('leave_team',{p_team:x});if(r.error)return toast(em(r.error));toast('You left the team');go('teams');break}
case'recruit':{const[t,v]=x.split('|'),r=await sb.from('teams').update({recruiting:v==='1'}).eq('id',t);if(r.error)toast('Error: '+r.error.message);go('team',t);break}
case'saveteam':{const row={name:$('#en').value.trim(),description:$('#ed').value.trim()};if(!row.name)return toast('Enter a team name');if(tmp.tl)row.logo_url=await (async()=>{const path=x+'/logo-'+Date.now()+'.png',u=await sb.storage.from('teams').upload(path,tmp.tl.blob,{contentType:'image/png',cacheControl:'31536000'});if(u.error)throw u.error;return sb.storage.from('teams').getPublicUrl(path).data.publicUrl})();
 const r=await sb.from('teams').update(row).eq('id',x);if(r.error)return toast(r.error.code==='23505'?'That team name is already taken':'Error: '+r.error.message);tmp={};toast('Team saved');go('team',x);break}
case'joinsolo':{const r=await sb.rpc('join_solo');if(r.error)toast(em(r.error));go('comp','solo');break}
case'joinanime':{const r=await sb.rpc('join_anime',{p_anime:x});if(r.error)toast(em(r.error));go('comp','anime');break}
case'submit':{const u=$('#su').value.trim();if(!/^https?:\/\//i.test(u))return toast('Enter a valid link');const r=await sb.rpc('submit_entry',{p_comp:x,p_url:u});toast(r.error?em(r.error):'Entry submitted');break}
case'reportai':{const v=$('#rr').value.trim();if(!v)return toast('Describe the issue');const r=await sb.from('reports').insert({reporter:U.id,kind:'entry',target:x,reason:v});if(r.error)return toast(em(r.error));$('#rr').value='';toast('Reported to administrators');break}
case'savenews':{const t=$('#nt').value.trim();if(!t)return toast('Title required');const d=$('#nd').value,row={title:t,body:$('#nb').value.trim(),image_url:tmp.nimg||(tmp.n&&tmp.n.image_url)||null,status:$('#ns').value,publish_at:d?new Date(d).toISOString():new Date().toISOString()};
 const r=tmp.n?await sb.from('news').update(row).eq('id',tmp.n.id):await sb.from('news').insert(row);if(r.error)return toast('Error: '+r.error.message);tmp={};toast('Saved');go('news');break}
case'editnews':{const r=await sb.from('news').select('*').eq('id',x).maybeSingle();tmp={n:r.data};go('news');break}
case'newnews':tmp={};go('news');break;
case'delnews':{const r=await sb.from('news').delete().eq('id',x);if(r.error)return toast('Error: '+r.error.message);go('news');break}
case'send':{const el=$('#cm'),v=el.value.trim();if(!v)return;el.value='';const r=await sb.from('messages').insert({user_id:U.id,body:v}).select('*,profiles(username,display_name,avatar_url)').single();if(r.error){el.value=v;return toast(em(r.error))}
 const b=$('#cmsgs');if(b&&!$('#m-'+r.data.id)){const e0=$('#cempty');if(e0)e0.remove();const t=document.createElement('div');t.innerHTML=cmsg(r.data,r.data.profiles);b.appendChild(t.firstElementChild);b.scrollTop=b.scrollHeight}break}
case'rpt':{const e=$('#rp-'+x);e.innerHTML=e.innerHTML?'':'<div class="row" style="margin:4px 0 0">'+['spam','offensive','other'].map(k=>`<button class="btn o" data-a="rsend" data-x="${x}|${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')+'</div>';break}
case'rsend':{const[id,reason]=x.split('|'),r=await sb.from('chat_reports').insert({message_id:Number(id),reporter:U.id,reason});toast(r.error?(r.error.code==='23505'?'You already reported this message.':(r.error.message||'').includes('cannot_report_own')?'You cannot report your own message.':'Error: '+r.error.message):'Thanks, your report was sent.');const e=$('#rp-'+id);if(e)e.innerHTML='';break}
case'modrestore':{const r=await sb.rpc('chat_admin_restore',{p_id:Number(x)});if(r.error)return toast(r.error.message);go('chat');break}
case'moddelete':{const r=await sb.from('messages').delete().eq('id',Number(x));if(r.error)return toast(r.error.message);go('chat');break}
case'modmute':{const[u,id]=x.split('|'),r=await sb.rpc('chat_admin_mute',{p_user:u,p_minutes:Number($('#md-'+id).value)});if(r.error)return toast(r.error.message);toast('User muted');go('chat');break}
case'modban':{const r=await sb.rpc('chat_admin_ban',{p_user:x});if(r.error)return toast(r.error.message);toast('User banned from the chat');go('chat');break}
case'modunmute':{const r=await sb.rpc('chat_admin_unmute',{p_user:x});if(r.error)return toast(r.error.message);go('chat');break}
case'addword':{const w=$('#bw').value.trim().toLowerCase();if(!w)return;const r=await sb.from('chat_banned_words').insert({word:w});if(r.error)return toast(r.error.code==='23514'?'Use letters, numbers and spaces only (2-40 characters).':r.error.code==='23505'?'Already in the list.':r.error.message);go('chat');break}
case'delword':{const r=await sb.from('chat_banned_words').delete().eq('word',x);if(r.error)return toast(r.error.message);go('chat');break}
case'skip':done();break}}catch(e){toast('Something went wrong: '+(e.message||e))}}
function intro(){const i=$('#intro');i.classList.remove('hidden');i.innerHTML='<img class="t" alt="SPECTRA 2027" src="'+LOGO+'"><div class="s">An International Editing Competition</div><button class="btn o" style="margin-top:40px" data-a="skip">Skip</button>';try{localStorage.setItem('spectra-intro','1')}catch(e){}i.timer=setTimeout(done,4600)}
function done(){clearTimeout($('#intro').timer);$('#intro').classList.add('hidden');go('home')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT'||t.tagName==='SELECT')return;if(['login','signup','verify','rverify','forgot','setpw'].includes(t.dataset.a))t.classList.add('load');Promise.resolve(act(t.dataset.a,t.dataset.x)).finally(()=>t.classList.remove('load'))});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset&&t.dataset.a,f=t.files&&t.files[0];if(!f)return;
 if(a==='avatar'){const w=Math.min(300,innerWidth-64);crop(f,{w,h:w,ow:640,oh:640,round:1,png:1,min:.5},b=>{tmp.av={blob:b,url:URL.createObjectURL(b)};$('#pa').innerHTML=av({avatar_url:tmp.av.url,display_name:'?'},'l');toast('Preview ready. Press Save to apply.')})}
 if(a==='tlogo'){const w=Math.min(300,innerWidth-64);crop(f,{w,h:w,ow:640,oh:640,round:1,png:1,min:.5},b=>{tmp.tl={blob:b,url:URL.createObjectURL(b)};$('#tp').innerHTML=av({avatar_url:tmp.tl.url,display_name:'?'},'l');toast('Preview ready. Press Save to apply.')})}
 if(a==='banner'){const w=Math.min(340,innerWidth-64);crop(f,{w,h:Math.round(w/3),ow:1500,oh:500,png:f.type==='image/png',min:1},b=>{tmp.bn={blob:b,url:URL.createObjectURL(b)};$('#pb').innerHTML='<img alt="" src="'+tmp.bn.url+'">';toast('Preview ready. Press Save to apply.')})}
 if(a==='nimg')fit(f,640,240,d=>{tmp.nimg=d;toast('Image ready')})});
document.addEventListener('input',e=>{if(e.target.id==='cd')e.target.value=e.target.value.replace(/\D/g,'')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cm'){act('send');return}if(e.key==='Enter'&&['em','pw','pw2','cd'].includes(e.target.id)){const b=document.querySelector('#auth .btn:not(.o)[data-a]:not([data-a=tab])');if(b)b.click()}});
function navArrows(){const n=$('#nav'),l=$('.na.l'),r=$('.na.r');if(!n||!l||!r)return;const max=n.scrollWidth-n.clientWidth;l.classList.toggle('show',n.scrollLeft>2);r.classList.toggle('show',n.scrollLeft<max-2)}
(function(){const n=$('#nav');n.addEventListener('scroll',navArrows,{passive:true});window.addEventListener('resize',navArrows);new MutationObserver(()=>setTimeout(navArrows,60)).observe(n,{childList:true});if(window.ResizeObserver)new ResizeObserver(navArrows).observe(n)})();
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')authUI('reset')});
(async()=>{const s=await sb.auth.getSession();if(s.data&&s.data.session)boot();else authUI('in')})();
</script></body></html>
